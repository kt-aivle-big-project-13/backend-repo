global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 이 파일은 dev 전용이다. 앱을 호스트에서 실행(bootRun)하므로 host-gateway 로 접근한다.
  # prod 는 ASG 외부 모니터링 인스턴스에서 prometheus.monitoring.yml 로 수집한다.
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'node'
    static_configs:
      - targets: [ 'node-exporter:9100' ]
