spring:
  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}

logging:
  level:
    com.aivle13: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: "*"