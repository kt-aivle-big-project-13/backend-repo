spring:
  application:
    name: fin-audit-ai

  profiles:
    default: dev

  jackson:
    time-zone: Asia/Seoul

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate      # 안전한 기본값. dev가 override 한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: fin-audit-ai
    distribution:
      percentiles-histogram:
        http.server.requests: true

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # 업로드 한도(100MB)보다 여유 있게 잡아야 초과 요청도 응답이 정상 전달됨.
    # 무제한(-1)은 공격자가 임의로 큰 바디를 보내도 서버가 끝까지 읽어들이는 리소스 고갈 위험이 있어 상한을 둔다.
    max-swallow-size: 200MB

cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

  ai-server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:120s}