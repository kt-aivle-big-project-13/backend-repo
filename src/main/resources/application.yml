spring:
  application:
    name: fin-audit-ai

  profiles:
    default: dev

  jackson:
    time-zone: Asia/Seoul

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate      # 안전한 기본값. dev가 override 한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      time  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-swallow-size: -1   # 초과 요청 바디를 흘려보내야 응답이 정상 전달됨