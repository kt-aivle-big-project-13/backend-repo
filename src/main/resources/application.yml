spring:
  application:
    name: fin-audit-ai

  profiles:
    default: dev

  jackson:
    time-zone: Asia/Seoul

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate      # 안전한 기본값. dev가 override 한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: fin-audit-ai
    distribution:
      percentiles-histogram:
        http.server.requests: true

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # 업로드 한도(100MB)보다 여유 있게 잡아야 초과 요청도 응답이 정상 전달됨.
    # 무제한(-1)은 공격자가 임의로 큰 바디를 보내도 서버가 끝까지 읽어들이는 리소스 고갈 위험이 있어 상한을 둔다.
    max-swallow-size: 200MB

cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@finaudit.ai}
    password: ${ADMIN_PASSWORD:1234}

  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

  ai-server:
    enabled: ${AI_SERVER_ENABLED:false}
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:120s}

  law-api:
    enabled: ${LAW_API_ENABLED:false}
    oc-key: ${LAW_API_OC_KEY:}
    base-url: ${LAW_API_BASE_URL:http://www.law.go.kr}
    connect-timeout: ${LAW_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${LAW_API_READ_TIMEOUT:10s}

  law-revision-job:
    cron: ${LAW_REVISION_CRON:0 0 6 * * *}

  llm:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:120s}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 7200000      # 2시간 (ms)
  refresh-token-validity: 1209600000  # 14일 (ms)
  remember-me-refresh-token-validity: 2592000000 # 자동 로그인 30일 (ms)

recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY}
  verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
  connect-timeout: ${RECAPTCHA_CONNECT_TIMEOUT:3s}
  read-timeout: ${RECAPTCHA_READ_TIMEOUT:5s}