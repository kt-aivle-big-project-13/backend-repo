spring:
  config:
    import: optional:file:.env[.properties]   # 테스트에선 .env 무시. optional 이라 없어도 됨

  # 테스트 클래스마다 mock 조합이 달라 Spring 컨텍스트가 여러 개 캐시되고, 컨텍스트마다
  # 커넥션 풀이 하나씩 생긴다. 기본값(풀 10, 유휴 유지)이면 컨테이너 max_connections 를
  # 넘겨 "too many clients" 로 컨텍스트 로딩이 깨지므로 풀을 작게 잡고 유휴는 곧 반납한다.
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000

  # 스키마는 Flyway 마이그레이션으로만 만든다. ddl-auto 로 만들면 마이그레이션 SQL 이
  # 배포 시점에 처음 실행되어, 버전 중복·문법 오류·제약 충돌을 CI 가 잡지 못한다(#319).
  # validate 라 엔티티와 마이그레이션 스키마가 어긋나도 컨텍스트 로딩에서 걸린다.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 컨테이너를 테스트 전체가 공유하므로 마이그레이션은 첫 컨텍스트에서 한 번만 돈다.
    clean-disabled: true

  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test-password

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN

recaptcha:
  secret-key: test-secret-key
  verify-url: http://localhost:9999/recaptcha
  connect-timeout: 3s
  read-timeout: 5s