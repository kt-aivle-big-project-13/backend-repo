spring:
  config:
    import: optional:file:.env[.properties]   # 테스트에선 .env 무시. optional 이라 없어도 됨

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test-password

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN

recaptcha:
  secret-key: test-secret-key
  verify-url: http://localhost:9999/recaptcha
  connect-timeout: 3s
  read-timeout: 5s