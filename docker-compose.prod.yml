services:
  backend:
    # CI(ci.yml docker 잡)가 빌드·푸시한 이미지를 그대로 받아 쓴다.
    # EC2에서 재빌드하면 인스턴스 기동이 수 분 지연되고, CI가 검증한 산출물과
    # 실제 구동물이 달라질 수 있다.
    image: ghcr.io/kt-aivle-big-project-13/backend-repo:${BACKEND_IMAGE_TAG:-develop}
    container_name: audit-backend
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: audit-redis
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: audit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: audit-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: audit-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
    # 모니터링 전용 인스턴스에서 원격 스크랩할 수 있도록 공개한다.
    # 접근 제어는 보안그룹(모니터링 SG만 허용)으로 한다.
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
